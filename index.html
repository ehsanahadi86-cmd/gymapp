<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2430">
<title>لاگ تمرین</title>
<style>
:root{--bg:#EDF0F3;--paper:#FFF;--ink:#1B2430;--muted:#66727F;--line:#D3D9E0;--field:#F6F8FA;--p0:#C8372D;--p1:#2A5DAF;--p2:#D9A515;--p3:#2C8A57;--p4:#6C4AB6;--p5:#E0702B;--font:Vazirmatn,Vazir,"Segoe UI",Tahoma,system-ui,sans-serif}
body.dark{--bg:#0F1419;--paper:#1A2027;--ink:#E8EDF2;--muted:#8A96A3;--line:#2A3540;--field:#232B33;--p2:#E8B93A}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;transition:background .15s,color .15s}
body.modal-open{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid #2A5DAF;outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-bottom:96px}
.loading{padding:40px 16px;text-align:center;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:rgba(237,240,243,.95);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
body.dark .top{background:rgba(15,20,25,.92)}
.title{font-weight:800;font-size:18px;margin:0;line-height:1.3}
.saved{font-size:12px;color:var(--muted);min-height:18px;line-height:18px}
.stepper{display:flex;align-items:center;gap:6px}
.wk{font-weight:700;min-width:66px;text-align:center}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;padding:0}
.ib:disabled{opacity:.35;cursor:default}
.main{padding:14px 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:96px;display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;text-align:start;padding:9px 12px;background:var(--paper);border:2px solid var(--line);border-radius:14px}
.chip.on{border-color:var(--dc)}
.disc{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,var(--paper) 0 18%,var(--dc) 20%);grid-row:span 2;flex:0 0 auto;display:inline-block}
.disc.sm{width:16px;height:16px;vertical-align:-2px;margin-inline-end:8px}
.cn{font-weight:700;font-size:14px;line-height:1.35}
.cs{font-size:11.5px;color:var(--muted);line-height:1.35}
.bwrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin:2px 0 6px}
.bwrow label{font-size:14px;color:var(--muted)}
.bwrow input{width:96px}
.weektools{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.ex{--tc:var(--p1);background:var(--paper);border:1px solid var(--line);border-inline-start:6px solid var(--dc);border-radius:16px;padding:14px;margin-top:12px}
.ex[data-type=strength]{--tc:var(--p1)}.ex[data-type=bodyweight]{--tc:var(--p4)}.ex[data-type=abs]{--tc:var(--p5)}.ex[data-type=cardio]{--tc:var(--p0)}.ex[data-type=aerobic]{--tc:var(--p3)}
.typebadge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:1px 9px;border-radius:999px;background:var(--tc);color:#fff;margin-inline-start:8px;vertical-align:middle;line-height:1.6}
.mgbadge{display:inline-flex;font-size:11px;padding:1px 9px;border-radius:999px;background:var(--field);border:1px solid var(--line);color:var(--muted);margin-inline-start:6px;vertical-align:middle;line-height:1.6}
.ssbadge{display:inline-flex;align-items:center;background:var(--p4);color:#fff;font-size:10px;font-weight:800;padding:1px 7px;border-radius:5px;margin-inline-start:6px;vertical-align:middle}
.typesep{display:flex;align-items:center;gap:10px;margin:18px 0 8px;font-size:12.5px;font-weight:800;color:var(--muted)}
.typesep::before,.typesep::after{content:'';height:1px;background:var(--line);flex:1}
.typesep-inner{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--tc)}
.ss-bridge{display:flex;align-items:center;gap:6px;margin:2px 0 8px 16px;font-size:11.5px;color:var(--p4);font-weight:700;padding:5px 10px;background:rgba(108,74,182,.09);border-radius:9px;border-inline-start:3px solid var(--p4)}
.ex.time-based .set,.ex.time-based .sethead{grid-template-columns:32px 1fr 44px}
.ex.time-based .set input[data-f=logW],.ex.time-based .set input[data-f=logQ]{display:none}
.ex-name{font-weight:800;font-size:16px;margin:0;line-height:1.5;cursor:pointer}
.ex-name:active{opacity:.7}
.target{font-size:13px;color:var(--muted)}
.coach{font-size:13px;margin-top:4px;padding:6px 10px;background:var(--field);border-radius:8px}
.last{font-size:12.5px;color:var(--muted);margin-top:2px}
.exvol{font-size:12.5px;color:var(--muted);margin-top:2px}
.delta-up{color:var(--p3);font-weight:800}.delta-down{color:var(--p0);font-weight:800}.delta-eq{color:var(--muted)}
.pr{display:inline-block;background:var(--p2);color:#fff;font-size:10.5px;font-weight:800;padding:1px 8px;border-radius:999px;margin-inline-start:6px;vertical-align:middle}
.sethead,.set{display:grid;grid-template-columns:28px 1fr 1fr .72fr 44px;gap:6px;align-items:center}
.sethead{margin:10px 0 4px;font-size:12px;color:var(--muted);text-align:center}
.set{margin-bottom:8px}.sn{text-align:center;font-weight:700;color:var(--muted)}
input.num,input.tx,textarea{width:100%;height:44px;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:0 10px}
input.num{text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
input.tx{text-align:start}textarea{height:auto;padding:10px;resize:vertical;line-height:1.7}
input::placeholder,textarea::placeholder{color:#9AA5B1}
.chk{width:100%;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;color:transparent;padding:0;transition:background .15s,border-color .15s}
.chk[aria-pressed=true]{background:var(--dc);border-color:var(--dc);color:#fff}
.exacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.addset{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.ss-toggle{border:0;background:none;color:var(--muted);font-size:12.5px;padding:6px 0;text-decoration:underline;text-underline-offset:3px;margin-inline-start:auto}
.ss-toggle[aria-pressed=true]{color:var(--p4);font-weight:800}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 18px;font-weight:600}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.danger{color:var(--p0);border-color:var(--p0)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.muted{color:var(--muted);font-size:13.5px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.box summary{font-weight:700;cursor:pointer;padding:2px 0}
.box p{margin:8px 0}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center}
.empty p{margin:0 0 12px;color:var(--muted)}
.dayed{background:var(--paper);border:1px solid var(--line);border-inline-start:6px solid var(--dc);border-radius:16px;padding:12px;margin-bottom:14px}
.dhead{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin-bottom:6px}
.dacts{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.dot{border:0;background:none;padding:2px;display:grid;place-items:center}
.dot .disc{width:30px;height:30px}
.ibtn{border:1px solid var(--line);background:var(--field);border-radius:9px;padding:4px 9px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.ibtn:disabled{opacity:.35}.ibtn.danger{color:var(--p0)}
.exed{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:8px}
.exline{display:grid;grid-template-columns:1fr 62px 84px;gap:8px}
.exline label{display:grid;gap:2px;font-size:11.5px;color:var(--muted)}
.exline label input{height:40px;text-align:center}
.exfoot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.exfoot input.tx{height:38px;flex:1}
.typerow{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 2px}
.typebtn{padding:3px 10px;font-size:11.5px;font-weight:700;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--muted)}
.typebtn.on{color:#fff;border-color:var(--tc);background:var(--tc)}
.typebtn[data-t=strength]{--tc:var(--p1)}.typebtn[data-t=bodyweight]{--tc:var(--p4)}.typebtn[data-t=abs]{--tc:var(--p5)}.typebtn[data-t=cardio]{--tc:var(--p0)}.typebtn[data-t=aerobic]{--tc:var(--p3)}
.ss-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--muted)}
.ss-chip[aria-pressed=true]{background:var(--p4);border-color:var(--p4);color:#fff;font-weight:700}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.h2{font-size:16px;font-weight:800;margin:0;line-height:1.5}
.dn{font-size:12.5px;color:var(--muted)}
.sum{margin:6px 0 4px;font-weight:600}
.spark{width:100%;height:auto;display:block;background:var(--field);border-radius:10px}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:3px}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.tabbar{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tb{border:0;background:none;padding:8px 2px;display:grid;justify-items:center;gap:2px;color:var(--muted);font-size:11px;border-top:3px solid transparent}
.tb.on{color:var(--ink);font-weight:700;border-top-color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:12px;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.exline2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.exline2 label{display:grid;gap:2px;font-size:11.5px;color:var(--muted)}
.exline2 label input{height:40px;text-align:center}
#restbar{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:7;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.2)}
#restbar[hidden]{display:none}
.rest-info{flex:1;min-width:0}
#restbar .n{font-size:12px;opacity:.75;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#restbar .t{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3}
.rest-actions{display:flex;gap:6px;flex-shrink:0}
#restbar button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.rest-progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12)}
.rest-progress-inner{height:100%;background:rgba(255,255,255,.7);transition:width .3s linear;width:100%}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:80vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.2)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.rangebar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.rangebar label{display:grid;gap:2px;font-size:12px;color:var(--muted)}
.rangebar input{width:80px;height:40px}
.sumgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 0}
.stat{background:var(--field);border-radius:12px;padding:8px 12px}
.stat b{display:block;font-size:19px;line-height:1.5}.stat span{font-size:12px;color:var(--muted)}
.h3{font-size:14px;font-weight:700;margin:12px 0 0}
table.rt{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
table.rt th,table.rt td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:center}
table.rt th{color:var(--muted);font-weight:600;font-size:12px}
table.rt td:first-child,table.rt th:first-child{text-align:start}
.settings{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px;display:grid;gap:10px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0}
.set-row label{font-size:14px}
.switch{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;border:0;padding:0;transition:background .2s;flex-shrink:0}
.switch::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.switch[aria-pressed=true]{background:var(--p3)}.switch[aria-pressed=true]::after{inset-inline-start:21px}
.daysum{display:flex;gap:16px;justify-content:center;margin-top:14px;font-size:12.5px;color:var(--muted)}
.daysum b{color:var(--ink);font-size:15px;margin-inline-end:3px}
.libtoolbar{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.libmodal{position:fixed;inset:0;z-index:30;display:grid;place-items:end stretch}
.libmodal[hidden]{display:none}
.libbackdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fadein .15s}
.libsheet{position:relative;background:var(--paper);border-radius:20px 20px 0 0;max-height:88vh;max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;animation:slideup .22s ease-out;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.libhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.libtitle{margin:0;font-size:16px;font-weight:800}
.libcontrols{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:stretch;flex-wrap:wrap}
.libcontrols input{flex:1;min-width:0}
.libcontrols input,.libcontrols select{height:42px;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:0 10px;font-size:14px}
.libcontrols select{min-width:130px;max-width:44%;flex-shrink:0}
.libtabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line)}
.libtab{flex:1;border:0;background:none;padding:10px 6px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.libtab.on{color:var(--ink);border-bottom-color:var(--ink)}
.liblist{overflow-y:auto;padding:8px 10px 24px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.libgroup{margin-bottom:6px}
.libgh{position:sticky;top:0;background:var(--paper);font-size:12px;font-weight:800;color:var(--muted);padding:8px 6px 6px;z-index:1;letter-spacing:.2px}
.librow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:start;padding:10px 12px;border:1px solid var(--line);background:var(--field);border-radius:12px;margin-bottom:6px;transition:border-color .1s,background .1s,color .1s}
.librow:hover,.librow:focus-visible{border-color:var(--ink)}
.librow b{font-size:14px;font-weight:700;display:block;line-height:1.35}
.librow small{font-size:11.5px;color:var(--muted);display:inline-block;line-height:1.35}
.libadd{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex-shrink:0;line-height:1}
.librow.added{background:var(--p3);border-color:var(--p3);color:#fff}
.librow.added small{color:rgba(255,255,255,.85)}
.librow.added .libadd{background:#fff;color:var(--p3)}
.webbtn{background:var(--p1);color:#fff;border:0;padding:10px 16px;border-radius:12px;font-weight:700;font-size:13.5px;margin:8px 4px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-inline-end:6px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fadein{from{opacity:0}to{opacity:1}}@keyframes slideup{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.detailmodal{position:fixed;inset:0;z-index:32;display:grid;place-items:center;padding:16px}
.detailmodal[hidden]{display:none}
.detailbackdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fadein .15s}
.detailcard{position:relative;background:var(--paper);border-radius:20px;max-width:520px;width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.4);animation:popin .2s ease-out}
@keyframes popin{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.detailhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.detailhead h2{margin:0;font-size:17px;font-weight:800;line-height:1.4}
.detailhead .en{font-size:12px;color:var(--muted);font-weight:500;direction:ltr;text-align:start;margin-top:2px}
.detailbody{padding:16px 18px 20px;overflow-y:auto;flex:1;min-height:0}
.detailmedia{background:var(--field);border-radius:12px;margin-bottom:12px;min-height:140px;display:grid;place-items:center;overflow:hidden;position:relative}
.detailmedia img{width:100%;height:auto;display:block;max-height:320px;object-fit:contain}
.detailmedia .placeholder{color:var(--muted);font-size:13px;padding:30px 20px;text-align:center;line-height:1.6}
.detailsec{margin-bottom:14px}
.detailsec h4{margin:0 0 6px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.3px}
.detailsec p{margin:0;font-size:14px;line-height:1.7;color:var(--ink);white-space:pre-wrap}
.detailtags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.detailtag{font-size:11.5px;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.detailtag.type{background:var(--tc);color:#fff;border-color:var(--tc);font-weight:700}
.profcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.profrow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.profrow label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.profrow label input,.profrow label select{height:42px;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:0 10px;font-size:14px;text-align:start}
.bmigrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.bmistat{background:var(--field);border-radius:12px;padding:8px 12px;text-align:center}
.bmistat b{display:block;font-size:18px;line-height:1.5}.bmistat span{font-size:11px;color:var(--muted)}
.bmi-cat{font-size:11px;padding:2px 8px;border-radius:999px;color:#fff;display:inline-block;margin-top:2px}
.measrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.measrow label{display:grid;gap:2px;font-size:11px;color:var(--muted)}
.measrow label input{height:38px;text-align:center;font-size:14px}
.measitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.measitem:last-child{border:0}
.measitem .vals{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}

}

function prevSet(exId,i){for(var w=S.week-1;w>=1;w--){var s=getSet(w,exId,i);if(num(s.w)!==null||num(s.r)!==null)return s}return{}}

function isPR(week,exId){var cur=bestW(week,exId);if(cur===null)return false;var hasPrior=false;for(var w=1;w<week;w++){var b=bestW(w,exId);if(b!==null){hasPrior=true;if(b>=cur)return false}}return hasPrior}

function suggestProgram(goal,level,daysPerWeek){
  var days=parseInt(daysPerWeek,10)||4;
  var splits=getSplit(level,days);
  var program=[];
  var reps=goal==='strength'?'4-6':goal==='fat_loss'?'12-15':goal==='fitness'?'10-12':'8-12';
  var sets=level==='beginner'?3:goal==='strength'?4:3;
  var rest=goal==='strength'?150:goal==='fat_loss'?60:90;
  splits.forEach(function(split,i){
    var day={id:uid(),name:split.name+' ('+fa(i+1)+')',c:i%6,exercises:[]};
    split.groups.forEach(function(g){
      var items=pickFromGroup(g,level);
      items.forEach(function(it){
        day.exercises.push({id:uid(),name:it.name,nameEn:it.nameEn||'',sets:sets,reps:reps,note:'',tempo:goal==='muscle'?'3-1-1-0':'',rir:goal==='strength'?'1-2':'2',rest:String(rest),type:it.type||'strength',ss:false,mg:it.mg||g});
      });
    });
    if(goal!=='strength'&&(level!=='beginner'||i%2===0)){
      var core=pickFromGroup('شکم و کور',level)[0];
      if(core)day.exercises.push({id:uid(),name:core.name,nameEn:core.nameEn||'',sets:3,reps:'10-15',note:'',tempo:'',rir:'1-2',rest:'45',type:core.type||'abs',ss:false,mg:'شکم'});
    }
    program.push(day);
  });
  return program
}
function getSplit(level,days){
  if(days<=2)return[{name:'فول بادی A',groups:['پا','سینه','پشت','سرشانه']},{name:'فول بادی B',groups:['پا','پشت','سینه','بازو']}];
  if(days===3){
    if(level==='beginner')return[{name:'فول بادی A',groups:['پا','سینه','پشت']},{name:'فول بادی B',groups:['پا','سرشانه','بازو']},{name:'فول بادی C',groups:['پا','سینه','پشت']}];
    return[{name:'Push',groups:['سینه','سرشانه','پشت‌بازو']},{name:'Pull',groups:['پشت','جلوبازو']},{name:'Legs',groups:['پا','باسن','ساق']}]
  }
  if(days===4)return[{name:'Upper A',groups:['سینه','پشت','سرشانه','بازو']},{name:'Lower A',groups:['پا','باسن','ساق']},{name:'Upper B',groups:['سینه','پشت','سرشانه','بازو']},{name:'Lower B',groups:['پا','باسن','ساق']}];
  if(days===5)return[{name:'Push',groups:['سینه','سرشانه','پشت‌بازو']},{name:'Pull',groups:['پشت','جلوبازو']},{name:'Legs',groups:['پا','باسن','ساق']},{name:'Upper',groups:['سینه','پشت','سرشانه']},{name:'Lower',groups:['پا','باسن']}];
  return[{name:'Push A',groups:['سینه','سرشانه','پشت‌بازو']},{name:'Pull A',groups:['پشت','جلوبازو']},{name:'Legs A',groups:['پا','باسن','ساق']},{name:'Push B',groups:['سینه','سرشانه','پشت‌بازو']},{name:'Pull B',groups:['پشت','جلوبازو']},{name:'Legs B',groups:['پا','باسن','ساق']}]
}
function pickFromGroup(group,level){
  var out=[],count=level==='beginner'?1:2;
  if(group==='بازو'){addFromGroup(out,'جلوبازو',count);addFromGroup(out,'پشت‌بازو',count)}
  else if(LIB[group])addFromGroup(out,group,count);
  return out
}
function addFromGroup(out,group,count){
  var items=LIB[group]||[];
  for(var i=0;i<items.length&&out.length<(out._limit||6);i++){
    var it=items[i];
    if(out.length>=count+(out._count||0))break;
    out.push({name:it[0],nameEn:it[1],mg:group,type:inferTypeFromLib(group,it[1])})
  }
  out._count=(out._count||0)+count
}

function labelOf(k){return{weight:'وزن',bodyFat:'چربی',chest:'سینه',waist:'شکم',hip:'باسن',arm:'بازو',thigh:'ران',calf:'ساق',neck:'گردن',shoulder:'شانه'}[k]||k}

function spark(pts,color,opts){
  opts=opts||{};var H=opts.height||110,W=320,L=34,R=10,T=12,B=20;
  var xs=pts.map(function(p){return p.x}),ys=pts.map(function(p){return p.y});
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
  var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  if(y0===y1){y0-=1;y1+=1}
  var pad=(y1-y0)*0.08;y0-=pad;y1+=pad;
  function sx(x){return x1===x0?(L+(W-L-R)/2):L+(x-x0)/(x1-x0)*(W-L-R)}
  function sy(y){return H-B-(y-y0)/(y1-y0)*(H-T-B)}
  var grid='';
  for(var k=0;k<=3;k++){var yPix=T+k*(H-T-B)/3;var val=y1-k*(y1-y0)/3;grid+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yPix+'" y2="'+yPix+'" stroke="currentColor" stroke-opacity="0.12" stroke-dasharray="2 3"/><text x="'+(L-5)+'" y="'+(yPix+3.5)+'" text-anchor="end" font-size="9" fill="currentColor" opacity="0.55">'+fa(fmt(val))+'</text>'}
  var poly=pts.map(function(p){return sx(p.x).toFixed(1)+','+sy(p.y).toFixed(1)}).join(' ');
  var dots=pts.map(function(p){return'<circle cx="'+sx(p.x).toFixed(1)+'" cy="'+sy(p.y).toFixed(1)+'" r="3.5" fill="currentColor"/>'}).join('');
  return'<svg class="spark" viewBox="0 0 '+W+' '+H+'" style="color:'+color+'"><g dir="ltr">'+grid+'<polyline points="'+poly+'" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+'</g></svg>'
}
function series(pts,color,unit){
  var first=pts[0],last=pts[pts.length-1],diff=last.y-first.y;
  var summary=pts.length>1?'از '+fa(fmt(first.y))+' به '+fa(fmt(last.y))+' '+unit+' ('+(diff>0?'+':diff<0?'−':'')+fa(fmt(Math.abs(diff)))+')':fa(fmt(last.y))+' '+unit+' در هفته '+fa(last.x);
  return'<div class="sum">'+summary+'</div>'+(pts.length>1?spark(pts,color)+'<div class="axis"><span>هفته '+fa(first.x)+'</span><span>هفته '+fa(last.x)+'</span></div>':'')
}
function barChart(data,color){
  var W=320,H=130,L=30,R=10,T=10,B=26;
  if(!data.length)return'';
  var max=Math.max.apply(null,data.map(function(d){return d.value}))||1;
  var bw=(W-L-R)/data.length;
  var bars=data.map(function(d,i){
    var x=L+i*bw+bw*0.15,w=bw*0.7,h=(d.value/max)*(H-T-B),y=H-B-h;
    return'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+color+'" rx="3" opacity="0.85"/><text x="'+(x+w/2)+'" y="'+(H-B+12)+'" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6">'+fa(d.label)+'</text><text x="'+(x+w/2)+'" y="'+(y-3)+'" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.75">'+fa(fmt(d.value))+'</text>'
  }).join('');
  return'<svg class="spark" viewBox="0 0 '+W+' '+H+'" style="color:'+color+'"><g>'+bars+'</g></svg>'
}

function isLogged(s){return!!s&&(num(s.w)!==null||num(s.r)!==null)}
function programIds(){var ids=[];S.program.days.forEach(function(d){d.exercises.forEach(function(e){ids.push(e.id)})});return ids}
function weeksWithData(){
  var ids=programIds();
  return Object.keys(S.logs).map(Number).filter(function(w){
    var l=S.logs[w];if(num(l.bw)!==null)return true;
    return ids.some(function(id){return(l.sets[id]||[]).some(setDone)})
  }).sort(function(a,b){return a-b})
}
function weekStats(w,ids){
  var out={sets:0,vol:0,rs:0,rn:0};
  var l=S.logs[w];if(!l)return out;
  ids.forEach(function(id){
    (l.sets[id]||[]).forEach(function(s){
      if(!setDone(s))return;
      out.sets++;
      if(num(s.w)!==null&&num(s.r)!==null)out.vol+=num(s.w)*num(s.r);
      var q=num(s.rir);if(q!==null){out.rs+=q;out.rn++}
    })
  });
  return out
}
function buildReport(){
  var weeks=weeksWithData();if(!weeks.length)return null;
  var from=repFrom!=null?repFrom:weeks[0];
  var to=repTo!=null?repTo:weeks[weeks.length-1];
  var sel=weeks.filter(function(w){return w>=from&&w<=to});
  var ids=programIds();
  var R={from:from,to:to,rows:[],tot:{sets:0,vol:0,rs:0,rn:0},sessions:0,bw:[],days:[],muscleVol:{}};
  sel.forEach(function(w){
    var st=weekStats(w,ids);
    R.tot.sets+=st.sets;R.tot.vol+=st.vol;R.tot.rs+=st.rs;R.tot.rn+=st.rn;
    var b=num(S.logs[w].bw);if(b!==null)R.bw.push(b);
    S.program.days.forEach(function(d){if(d.exercises.some(function(e){return(S.logs[w].sets[e.id]||[]).some(setDone)}))R.sessions++});
    R.rows.push({w:w,sets:st.sets,vol:Math.round(st.vol),rir:st.rn?fmt(st.rs/st.rn):null,bw:b})
  });
  S.program.days.forEach(function(d){
    var dd={name:d.name,c:d.c,exs:[]};
    d.exercises.forEach(function(ex){
      var rows=[];
      sel.forEach(function(w){
        var done=((S.logs[w]&&S.logs[w].sets[ex.id])||[]).filter(setDone);
        if(!done.length)return;
        var best=null,vol=0,rs=0,rn=0;
        done.forEach(function(s){
          var wv=num(s.w),rv=num(s.r);
          if(wv!==null&&rv!==null){vol+=wv*rv;if(!best||wv>best.w||(wv===best.w&&rv>best.r))best={w:wv,r:rv,rm:epley(wv,rv)}}
          var q=num(s.rir);if(q!==null){rs+=q;rn++}
        });
        rows.push({w:w,n:done.length,best:best,vol:Math.round(vol),rir:rn?fmt(rs/rn):null})
      });
      if(rows.length){
        dd.exs.push({name:ex.name,type:exType(ex),rows:rows});
        var mg=ex.mg||'نامشخص';
        if(!R.muscleVol[mg])R.muscleVol[mg]=0;
        rows.forEach(function(r){R.muscleVol[mg]+=r.vol})
      }
    });
    if(dd.exs.length)R.days.push(dd)
  });
  return R
}

  return L.join('\n')
}

  var stats=[

  var prList=[];
  S.program.days.forEach(function(d){

      Object.keys(S.logs).forEach(function(w){
        var arr=(S.logs[w].sets||{})[ex.id]||[];

var rest=null,restInt=null;
function startRestFor(exId,i){
  var ex=findEx(exId);if(!ex||!ex.rest||isTimeBased(exType(ex)))return;
  var sec=num(perSet(ex.rest,i));if(sec&&sec>0)startRest(sec,ex.name)
}
function startRest(sec,name){rest={end:Date.now()+sec*1000,total:sec,name:name,rang:false};clearInterval(restInt);restInt=setInterval(tickRest,250);tickRest()}
function stopRest(){rest=null;clearInterval(restInt);var el=document.getElementById('restbar');if(el)el.hidden=true}
function tickRest(){
  var el=document.getElementById('restbar');if(!el||!rest)return;
  var left=Math.ceil((rest.end-Date.now())/1000);
  el.hidden=false;el.querySelector('.n').textContent='استراحت · '+rest.name;
  var prog=el.querySelector('.rest-progress-inner');
  if(prog){var pct=Math.max(0,Math.min(100,100*left/rest.total));prog.style.width=pct+'%'}
  if(left<=0){if(!rest.rang){rest.rang=true;el.querySelector('.t').textContent='تمام شد';beep();vibrate()}if(left<=-60){stopRest();return}return}
  rest.rang=false;el.querySelector('.t').textContent=fa(Math.floor(left/60))+':'+fa(('0'+(left%60)).slice(-2))
}
function restAdd30(){if(!rest)return;if(rest.end<=Date.now()){rest.end=Date.now()+30000;rest.total=30;rest.rang=false;clearInterval(restInt);restInt=setInterval(tickRest,250)}else{rest.end+=30000;rest.total+=30}tickRest()}
function beep(){if(!S.settings||S.settings.sound===false)return;try{var ctx=new(window.AudioContext||window.webkitAudioContext)();for(var k=0;k<2;k++){var o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;var t=ctx.currentTime+k*0.25;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);o.start(t);o.stop(t+0.25)}}catch(e){}}
function vibrate(){if(S.settings&&S.settings.vibrate===false)return;try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}

function render(){
  ensureSettings();ensureProfile();

  var body;
  if(tab==='log')body=logHTML();
  else if(tab==='prog')body=programHTML();
  else if(tab==='stat')body=statHTML();
  else if(tab==='rep')body=reportHTML();
  else body=profileHTML();
  document.getElementById('app').innerHTML=headerHTML()+'<main class="main">'+body+'</main>'+tabbarHTML()
}

  else if(f==='logQ')setVal(el.dataset.e,+el.dataset.i,'rir',norm(el.value));
  else if(f==='bw')wkData(S.week).bw=norm(el.value);
  else if(f==='dayName'){var d=findDay(el.dataset.d);if(d)d.name=el.value}
  else if(f==='profName')S.profile.name=el.value;
  else if(f==='profAge')S.profile.age=norm(el.value);
  else if(f==='profHeight')S.profile.height=norm(el.value);
  else if(f==='profGender')S.profile.gender=el.value;
  else if((ex=findEx(el.dataset.e))){
    if(f==='exName')ex.name=el.value;
    else if(f==='exSets')ex.sets=parseInt(norm(el.value),10)||0;
    else if(f==='exReps')ex.reps=norm(el.value);
    else if(f==='exNote')ex.note=el.value;
    else if(f==='exTempo')ex.tempo=norm(el.value);
    else if(f==='exRir')ex.rir=norm(el.value);
    else if(f==='exRest')ex.rest=norm(el.value);
    else if(f==='exMg')ex.mg=el.value;
  }
  queueSave()
});

function parseProgram(text){
  var days=[],cur=null;
  var pat=/(\d+)\s*[x×*]\s*(\d+(?:\s*[-–~]\s*\d+)?)/i;
  var tempoRe=/(?:tempo|تمپو)\s*[:=]?\s*(\d[\d\-xX\/]*)/i;
  var rirRe=/rir\s*[:=]?\s*(\d+(?:[-–]\d+)?(?:\/\d+(?:[-–]\d+)?)*)/i;
  var restRe=/(?:rest|استراحت)\s*[:=]?\s*(\d+(?:\/\d+)*)\s*(دقیقه|ثانیه|min[a-z]*|sec[a-z]*|m(?![a-z])|s(?![a-z]))?/i;
  function newDay(name){cur={id:uid(),name:name||('روز '+fa(days.length+1)),c:days.length%6,exercises:[]};days.push(cur)}
  var lines=norm(text).split(/\r?\n/);
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();if(!line)continue;
    var meta={tempo:'',rir:'',rest:''};
    line=line.replace(tempoRe,function(_,t){meta.tempo=t;return' '}).replace(rirRe,function(_,r){meta.rir=r;return' '}).replace(restRe,function(_,n,u){var mult=(u&&/^(دقیقه|min|m$)/i.test(u))?60:1;meta.rest=n.split('/').map(function(x){return String(Math.round(parseFloat(x)*mult))}).join('/');return' '});
    line=line.replace(/\s+/g,' ').trim();if(!line)continue;
    var m=line.match(pat);
    var headerish=/^#+/.test(line)||/[:：]$/.test(line)||/^(روز|جلسه|day|session)(\s|$)/i.test(line);
    if(!m&&headerish){newDay(line.replace(/^#+\s*/,'').replace(/[:：]\s*$/,'').trim());continue}
    if(!cur)newDay();
    var sets=3,reps='',name=line;
    if(m){sets=parseInt(m[1],10);reps=m[2].replace(/\s+/g,'');name=line.replace(m[0],' ')}
    name=name.replace(/^\s*(?:[-*•]|\d+[.)])\s*/,'').replace(/\s+/g,' ').replace(/[\s\-–—:|،]+$/,'').trim();
    if(!name)continue;
    cur.exercises.push({id:uid(),name:name,sets:sets,reps:reps,note:'',tempo:meta.tempo,rir:meta.rir,rest:meta.rest,type:inferTypeFromName(name),ss:false,mg:''})
  }
  return days
}

function normalize(d){
  var out={
    program:{days:[]},logs:d.logs||{},week:d.week>0?d.week:1,
    settings:d.settings&&typeof d.settings==='object'?{dark:!!d.settings.dark,sound:d.settings.sound!==false,vibrate:d.settings.vibrate!==false}:defaults(),
    profile:d.profile&&typeof d.profile==='object'?{name:d.profile.name||'',age:d.profile.age||'',gender:d.profile.gender||'male',height:d.profile.height||'',goal:d.profile.goal||'muscle',level:d.profile.level||'intermediate',daysPerWeek:d.profile.daysPerWeek||4,measurements:Array.isArray(d.profile.measurements)?d.profile.measurements:[]}:{name:'',age:'',gender:'male',height:'',goal:'muscle',level:'intermediate',daysPerWeek:4,measurements:[]},
    customLib:d.customLib||{},exDetails:d.exDetails||{}
  };
  (d.program.days||[]).forEach(function(day,i){
    out.program.days.push({
      id:day.id||uid(),
      name:day.name||('روز '+fa(i+1)),
      c:typeof day.c==='number'?day.c:i%6,
      exercises:(day.exercises||[]).map(function(e){
        return{id:e.id||uid(),name:e.name||'',nameEn:e.nameEn||'',sets:e.sets|0,reps:e.reps||'',note:e.note||'',tempo:e.tempo||'',rir:e.rir==null?'':e.rir,rest:e.rest||'',type:e.type||inferTypeFromName(e.name),ss:!!e.ss,mg:e.mg||'',imageUrl:e.imageUrl||null}
      })
    })
  });
  return out
}

    var iconUrl='data:image/svg+xml,'+encodeURIComponent(iconSvg);
    var manifest={name:'لاگ تمرین',short_name:'لاگ تمرین',description:'دفترچهٔ تمرین و پیشرفت',start_url:'.',scope:'.',display:'standalone',orientation:'portrait',background_color:'#EDF0F3',theme_color:'#1B2430',lang:'fa',dir:'rtl',icons:[{src:iconUrl,sizes:'192x192',type:'image/svg+xml',purpose:'any'},{src:iconUrl,sizes:'512x512',type:'image/svg+xml',purpose:'any'},{src:iconUrl,sizes:'512x512',type:'image/svg+xml',purpose:'maskable'}]};
    var blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
    var link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(blob);document.head.appendChild(link)
  }catch(e){}
}
